<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title data-lang-key="TITLE">Ticker</title>
    <link rel="icon" href="./glucose-polygolapps/ticker/ticker.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/Polygol/polygol.github.io@main/assets/polygolapp/api/polygol-api.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: var(--background-color);
            user-select: none;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .clock {
            font-size: 8rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .info {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .date {
            font-size: 2rem;
            font-weight: 400;
            color: var(--text-color);
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .clock {
                font-size: 6rem;
            }
        }

        @media (max-width: 480px) {
            .clock {
                font-size: 4rem;
            }
        }
    </style>
    <script src="lang.js"></script>
</head>
<body>
    <div class="container">
        <div class="clock" id="clock"></div>
        <div class="info">
            <div class="date" id="date"></div>
        </div>
    </div>

    <script>
        function updateClockAndDate() {
            const clockElement = document.getElementById('clock');
            const dateElement = document.getElementById('date');
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateElement.textContent = now.toLocaleDateString(getLocaleBcp(), options);
        }

        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();
    </script>
<script>
function getAppLanguage() {
    let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
    if (l === 'JA') l = 'JP';
    return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
}

function getLocaleBcp() {
    const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
    return bcpMap[getAppLanguage()] || 'en-US';
}

function t(key, params = {}) {
    const lang = getAppLanguage();
    const dict = window['LANG_' + lang + '_TICKER'] || window['LANG_EN_TICKER'] || {};
    let str = dict[key] || key;
    Object.keys(params).forEach(p => str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]));
    return str;
}

function applyLanguage(langCode) {
    if (langCode) localStorage.setItem('language', langCode);
    const lang = getAppLanguage();
    document.documentElement.lang = getLocaleBcp();
    
    document.querySelectorAll('[data-lang-key]').forEach(el => {
        const k = el.getAttribute('data-lang-key');
        if (k) {
            if (el.tagName === 'TITLE') document.title = t(k);
            else el.textContent = t(k);
        }
    });
    
    if (typeof updateClockAndDate === 'function') updateClockAndDate();
}

window.addEventListener('message', (e) => {
    if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
        applyLanguage(e.data.languageCode);
    }
});

window.addEventListener('DOMContentLoaded', () => applyLanguage());
</script>
</body>
</html>
